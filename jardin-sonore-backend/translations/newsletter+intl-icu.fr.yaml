  consent_help: "En cochant cette case, vous confirmez que cette personne a autorisé l’envoi de newsletters à cette adresse. L’inscription est immédiate et aucun e-mail de confirmation ne sera envoyé. L’autorisation vaut partout où cette adresse est utilisée, dans l’annuaire comme sur le portail."
