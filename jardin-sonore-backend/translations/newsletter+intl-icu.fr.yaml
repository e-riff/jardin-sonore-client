      actions: "Actions"
    scope:
      title: "Portée de l’abonnement et des rattachements"
      address_title: "Abonnement de l’adresse"
      address: "L’état newsletter appartient à l’adresse e-mail. Il s’applique partout où elle est utilisée et conditionne son éligibilité aux campagnes."
      links_title: "Fiches rattachées"
      links: "Le rattachement permet de corriger une fiche, par exemple si cette adresse n’est plus celle de la structure. Détacher une fiche ne désabonne pas l’adresse et ne modifie pas ses autres fiches. Le nombre affiché compte les fiches actuellement rattachées et actives."
    status_help:
      title: "Comprendre les abonnements et les fiches"
      subscribed: "Le système considère cette adresse éligible aux envois si elle correspond à l’audience choisie. Cela peut venir d’un accord attesté au backoffice, d’une case cochée sur le portail ou d’une inscription publique confirmée. Attention : une nouvelle adresse créée par import de l’annuaire reçoit actuellement cet état par défaut, sans preuve d’un accord individuel enregistrée."
      not_subscribed: "Aucune autorisation d’envoi n’est enregistrée pour cette adresse. Exemple : l’adresse figure dans une fiche de l’annuaire, mais la case newsletter n’a pas été cochée. La fiche et l’adresse restent conservées."
      unsubscribed: "La personne a retiré son autorisation. Exemple : elle s’est désinscrite depuis son profil portail ou a demandé le retrait au backoffice. L’adresse reste conservée et est exclue des envois, même si plusieurs fiches l’utilisent."
      inactive: "L’adresse a été désactivée manuellement dans le backoffice. Elle reste conservée, mais ne peut pas recevoir de campagne. Ce statut est différent d’une désinscription demandée par la personne."
      pending: "La personne a rempli le formulaire public, mais n’a pas encore cliqué sur le lien reçu par e-mail. L’adresse ne recevra pas de newsletter tant que l’inscription n’est pas confirmée."
  status:
